[project]
name = "gisorders"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg==0.30.0",
    "bcrypt==4.2.0",
    "dotenv==0.9.9",
    "fastapi==0.117.0",
    "geoalchemy2>=0.18.1",
    "greenlet>=3.2.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]==2.12.0a1",
    "python-jose==3.5.0",
    "python-multipart==0.0.20",
    "redis>=6.0",
    "shapely>=2.1.2",
    "sqlalchemy==2.0.43",
    "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "fakeredis[lua]>=2.30",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["api", "core"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E712: SQLAlchemy требует сравнений вида Column == True в выражениях
ignore = ["E501", "E712"]

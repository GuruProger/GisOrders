name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: GisOrders
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d GisOrders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql+asyncpg://user:password@localhost:5432/GisOrders
      JWT_SECRET_KEY: ci-secret-key-with-at-least-32-characters
      POSTGRES_DB: GisOrders
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create test database
        run: |
          PGPASSWORD=password psql -h localhost -U user -d GisOrders \
            -c "CREATE DATABASE gisorders_test;"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q --cov=api --cov=core --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: GisOrders
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d GisOrders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql+asyncpg://user:password@localhost:5432/GisOrders
      JWT_SECRET_KEY: ci-secret-key-with-at-least-32-characters
      E2E_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:5173
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Start backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Stop backend
        if: always()
        run: |
          pkill -f 'uvicorn main:app' || true
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: /tmp/backend.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod -t gisorders-backend:ci backend

      - name: Build frontend image
        run: docker build -t gisorders-frontend:ci frontend

# Loaded from the http block via /etc/nginx/conf.d/*.conf (before default.conf).
# Maps WebSocket upgrades and preserves an upstream X-Forwarded-Proto header.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
